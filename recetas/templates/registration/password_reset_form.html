{% load django_bootstrap5 %}

{% block contenido %}
<div class="container mt-5">
  <h2>Recuperar Contraseña</h2>

    {% csrf_token %}
    {% bootstrap_form form %}
    <button type="submit" class="btn btn-primary">Enviar enlace</button>
  </form>
</div>
{% endblock %}
