{% extends "principal.html" %}

{% block cabecera %}
<h1>Todas las recetas</h1>
{% endblock  %}

{% block contenido %}
    <p>Total de recetas: {{ recipes_list|length }}</p>
    {% for recipe in recipes_list %}
        <div class="list">
            <p>Titulo: {{ recipe.title }} -</p>  <a href="{% url "recipe" recipe=recipe.id %}" class="link"> Ver receta</a>
        </div>
    {% endfor %}
{% endblock  %}
